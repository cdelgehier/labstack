[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "labstack"
version = "0.1.0"
description = "Personal labs on Apple Silicon with QEMU."
readme = "README.md"
authors = [
    {name = "Cedric DELGEHIER", email = "cedric.delgehier@gmail.com"},
]
requires-python = ">=3.15"
dependencies = [
    "pydantic>=2.14.1,<3",
    "pydantic-settings>=2.16.0,<3",
    "pyyaml>=6.0.3,<7",
    "structlog>=26.1.0,<27",
]

[project.scripts]
labstack = "labstack.main:entrypoint"

[dependency-groups]
dev = [
    "commitizen>=4.19.2",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
    "ty>=0.0.87",
]

[tool.hatch.build.targets.wheel]
packages = ["labstack"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "semver"
tag_format = "v$version"
update_changelog_on_bump = true
major_version_zero = true
version_files = ["pyproject.toml:^version"]
bump_message = "chore(release): bump version $current_version -> $new_version"
# Keep the lock file in the same commit as the new project version.
pre_bump_hooks = ["uv lock", "git add uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --cov=labstack --cov-report=term-missing"

[tool.ruff]
line-length = 88
target-version = "py315"
fix = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]
