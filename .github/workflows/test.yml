name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Code and configuration checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Task
        uses: arduino/setup-task@v2

      - name: Install system tools
        # Disk, ISO and transfer tests use real tools without starting a VM.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-utils xorriso rsync shellcheck

      - name: Install Python and project dependencies
        run: |
          uv python install "$(cat .python-version)"
          uv sync --locked

      - name: Run CI tasks
        run: task ci

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: logs/pytest.xml
          if-no-files-found: ignore
          retention-days: 7
